<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFECB3" />
  <meta name="description" content="シンプルなメモアプリ。オフラインでも使え、Google サインインで端末間同期もできます。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="メモ" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>メモ</title>
  <!--
    任意: ここで設定を注入することもできます（firebase-config.local.js より優先）
    <script>
      window.__FIREBASE_CONFIG__ = {
        apiKey: "...",
        authDomain: "...",
        projectId: "...",
        storageBucket: "...",
        messagingSenderId: "...",
        appId: "..."
      };
    </script>
  -->
</head>
<body>
  <!-- 一覧画面 -->
  <div id="list-screen" class="app screen is-active" aria-hidden="false">
    <header class="header">
      <div class="header-title-block">
        <h1>メモ</h1>
        <p id="sync-status" class="sync-status" data-status="ローカルのみ" aria-live="polite">ローカルのみ</p>
      </div>
      <div class="header-actions">
        <button type="button" id="btn-new" class="btn btn-primary" aria-label="新しいメモを作成">
          ＋ 新規
        </button>
      </div>
    </header>
    <div id="auth-bar" class="auth-bar">
      <span id="auth-user" class="auth-user" hidden></span>
      <button type="button" id="btn-sign-in" class="btn btn-ghost btn-sm">Googleでサインイン</button>
      <button type="button" id="btn-sign-out" class="btn btn-ghost btn-sm" hidden>サインアウト</button>
    </div>
    <div class="project-bar" role="navigation" aria-label="プロジェクト">
      <div id="project-chips" class="project-chips" role="tablist"></div>
      <button type="button" id="btn-projects-manage" class="btn btn-ghost btn-sm project-manage-btn" aria-label="プロジェクト管理">
        管理
      </button>
    </div>
    <main class="main">
      <div id="empty-state" class="empty">
        <div class="empty-icon" aria-hidden="true">📝</div>
        <h2 id="empty-title">メモがありません</h2>
        <p id="empty-desc">右上の「新規」から最初のメモを作成しましょう。</p>
        <button type="button" id="btn-empty-new" class="btn btn-primary">メモを作成</button>
      </div>
      <ul id="note-list" class="note-list" aria-label="メモ一覧" hidden></ul>
    </main>
  </div>

  <!-- 編集画面 -->
  <div id="editor-screen" class="screen" aria-hidden="true">
    <header class="header">
      <button type="button" id="btn-back" class="btn btn-icon" aria-label="一覧に戻る">←</button>
      <h1 id="editor-heading">メモを編集</h1>
      <div class="header-actions">
        <button type="button" id="btn-delete-in-editor" class="btn btn-icon" aria-label="削除" hidden title="削除">🗑</button>
      </div>
    </header>
    <div class="editor-body">
      <div>
        <label class="field-label" for="note-title">タイトル</label>
        <input
          type="text"
          id="note-title"
          class="input-title"
          placeholder="タイトル（任意）"
          maxlength="200"
          autocomplete="off"
          enterkeyhint="next"
        />
      </div>
      <div>
        <label class="field-label" for="note-project">プロジェクト</label>
        <select id="note-project" class="input-select" aria-label="プロジェクトを選択">
          <option value="">未分類</option>
        </select>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;min-height:0;">
        <label class="field-label" for="note-content">本文</label>
        <textarea
          id="note-content"
          class="input-content"
          placeholder="メモを入力…"
          spellcheck="true"
        ></textarea>
      </div>
      <div class="editor-actions">
        <button type="button" id="btn-save" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 削除確認モーダル -->
  <div
    id="delete-modal"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-modal-title"
    aria-hidden="true"
  >
    <div class="modal">
      <h2 id="delete-modal-title">メモを削除しますか？</h2>
      <p id="delete-modal-desc">この操作は取り消せません。</p>
      <div class="modal-actions">
        <button type="button" id="btn-cancel-delete" class="btn btn-ghost">キャンセル</button>
        <button type="button" id="btn-confirm-delete" class="btn btn-danger">削除する</button>
      </div>
    </div>
  </div>

  <!-- プロジェクト管理モーダル -->
  <div
    id="projects-modal"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="projects-modal-title"
    aria-hidden="true"
  >
    <div class="modal modal-sheet">
      <h2 id="projects-modal-title">プロジェクト管理</h2>
      <p class="modal-hint">追加・名前変更・削除ができます。削除したプロジェクトのメモは「未分類」になります。</p>
      <form id="project-add-form" class="project-add-form">
        <input
          type="text"
          id="project-name-input"
          class="input-title"
          placeholder="新しいプロジェクト名"
          maxlength="60"
          autocomplete="off"
          required
        />
        <button type="submit" id="btn-add-project" class="btn btn-primary btn-sm">追加</button>
      </form>
      <ul id="project-manage-list" class="project-manage-list" aria-label="プロジェクト一覧"></ul>
      <div class="modal-actions">
        <button type="button" id="btn-close-projects" class="btn btn-ghost">閉じる</button>
      </div>
    </div>
  </div>

  <!-- プロジェクト名変更モーダル -->
  <div
    id="rename-modal"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="rename-modal-title"
    aria-hidden="true"
  >
    <div class="modal">
      <h2 id="rename-modal-title">名前を変更</h2>
      <input
        type="text"
        id="rename-project-input"
        class="input-title"
        maxlength="60"
        autocomplete="off"
      />
      <div class="modal-actions" style="margin-top:16px;">
        <button type="button" id="btn-cancel-rename" class="btn btn-ghost">キャンセル</button>
        <button type="button" id="btn-confirm-rename" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
